name: PerfScope
version: ${project.version}
main: cn.perfscope.PerfScope
api-version: "1.20"
folia-supported: true
description: 高性能服务器性能监测插件 - 专注 Paper 系服务端（Paper/Purpur/Pufferfish/Folia）
author: sqkl520
website: https://github.com/sqkl520/Minecraft-server-plugin-PerfScope

# 专注 Paper 系服务端：Paper / Purpur / Pufferfish / Folia 及其分支
# Paper 运行时原生自带 Adventure，完整 MSPT / ActionBar 功能，无需 shade
# （红石/网络监测已于 v1.1 下线）

commands:
  perfscope:
    description: PerfScope 主指令 - 查看实时性能数据
    usage: |
      /perfscope <子命令>
    aliases: [pscope, perf]
    permission: perfscope.use
    # 9A-24：此值只是"消息层加载前的首帧兜底"。插件启动/重载时会把 messages.yml 的
    # no-permission 回写为权限拒绝文案（Messages#applyCommandPermissionMessage），
    # 因此改文案请改 messages.yml，不要依赖这里（否则会出现两份副本各说各话）。
    permission-message: 你没有权限使用此指令喵

permissions:
  perfscope.use:
    description: 允许使用 PerfScope 基本指令
    default: op
  perfscope.reload:
    description: 允许重载 PerfScope 配置
    default: op
  perfscope.export:
    description: 允许导出性能报告
    default: op
  perfscope.alert:
    description: 允许接收 PerfScope 告警推送
    default: op
  perfscope.admin:
    description: 允许使用 PerfScope 管理指令
    default: op
    children:
      perfscope.use: true
      perfscope.reload: true
      perfscope.export: true
      perfscope.alert: true
