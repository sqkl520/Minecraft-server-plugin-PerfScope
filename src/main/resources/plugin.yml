name: PerfScope
version: ${project.version}
main: cn.perfscope.PerfScope
api-version: "1.20"
folia-supported: true
description: Server performance monitor for Paper-family servers (Paper / Purpur / Folia; Folia has limited metrics, Pufferfish untested)
author: sqkl520
website: https://github.com/sqkl520/Minecraft-server-plugin-PerfScope

# 专注 Paper 系服务端：Paper / Purpur / Pufferfish / Folia 及其分支
# Paper 运行时原生自带 Adventure，完整 MSPT / ActionBar 功能，无需 shade
# （红石/网络监测已于 v1.1 下线）

commands:
  perfscope:
    description: PerfScope main command - inspect live server performance
    usage: |
      /perfscope <子命令>
    aliases: [pscope, perf]
    permission: perfscope.use
    # Runtime fallback only: this value applies for the brief moment before the message layer
    # loads. From then on Messages#applyCommandPermissionMessage writes the `no-permission`
    # message of the active language onto this command. Translate text in messages.yml,
    # not here — otherwise the two copies drift apart.
    permission-message: You do not have permission to use this command.

permissions:
  perfscope.use:
    description: Allows using basic PerfScope commands
    default: op
  perfscope.reload:
    description: Allows reloading the PerfScope configuration
    default: op
  perfscope.export:
    description: Allows exporting performance reports
    default: op
  perfscope.alert:
    description: Allows receiving PerfScope alert notifications
    default: op
  perfscope.admin:
    description: Allows using PerfScope admin commands
    default: op
    children:
      perfscope.use: true
      perfscope.reload: true
      perfscope.export: true
      perfscope.alert: true
