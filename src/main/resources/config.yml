# ==========================================
# PerfScope - 服务器性能监测插件 配置文件
# ==========================================

# 配置结构版本（9A-11）：由插件自动识别与维护，请勿手改。
# 缺这一行 = 旧版配置，插件会提示"检测到旧版配置"、把原文件备份为 config.yml.bak-<时间戳>，
# 再在文件末尾自动补写本行；已有配置项的原值不受影响，新增项按默认值生效。
config-version: 1

# ------------------------------------------
# 单位速查表（9A-11）
# ------------------------------------------
# | 配置项                            | 单位 / 含义                            |
# |-----------------------------------|----------------------------------------|
# | general.update_interval           | tick（20 tick ≈ 1 秒）                 |
# | alerts.cooldown-seconds           | 秒                                      |
# | history.sample-interval-seconds   | 秒                                      |
# | hotspots.sample-every-cycles      | 采集周期数（1 周期 ≈ update_interval）  |
# | hotspots.scan-shards              | 分片数（1 个分片 = 一轮扫描的一块）     |
# | history.retention-days            | 天                                      |
# | report.auto_export_interval       | 分钟                                    |
# | report.retention_days             | 天（0 = 永久保留）                      |
# | tps.* / mspt.*                    | TPS / 毫秒                              |
# | players.* / memory.* / cpu.*      | 百分比（players 为占 max_players 的比例） |
#
# 命名风格说明（9A-11）：本文件的键名存在历史遗留混用——有的用下划线
# （update_interval、total_warning_threshold），有的用连字符（bstats-enabled、
# cooldown-seconds）。为保证老用户配置继续有效，键名一律不改，新增项沿用所在节的既有风格。

# 常规设置
general:
  # 数据采集间隔 (tick), 20 = 1秒
  update_interval: 20
  # 是否在插件启动时显示详细信息
  verbose_startup: true
  # 是否启用调试日志
  debug: false
  # 界面语言（用户可见文案）: en = English（默认）, zh = 简体中文
  # 首次安装默认英文；随时可改成 zh 并执行 /perfscope reload 切换，中英两种语言均完整覆盖。
  # 切换是整份生效的：不会出现「一半英文一半中文」的混排。
  # 兼容写法：en_US / en-us 归一为 en，zh_CN / zh-TW 归一为 zh；其余值告警后回退 en。
  language: en
  # bStats 匿名统计 (https://bstats.org): 仅上报插件使用量/服务端环境等匿名数据，无个人信息。
  # 关闭方式二选一: 此处设为 false, 或在 plugins/bStats/config.yml 中设 enabled: false (对全服所有插件生效)
  #
  # ⚠️ 上报内容分两层，粒度不同，请按需阅读：
  #
  # 【A 层：bStats 库自动上报（本插件无法逐项控制）】
  #   服务端类型与版本、插件版本、操作系统名与版本号(如 "Windows 10")、CPU 核心数、
  #   当前在线玩家数【精确值，未分桶】、正版/离线模式、服务器 UUID（随机生成，非服务器地址）
  #
  # 【B 层：本插件自定义图表（已分桶）】
  #   server_software   服务端类型（Paper/Spigot/Bukkit/Folia）
  #   language          当前界面语言（en/zh/other）
  #   module_enabled    各采集模块的开关状态
  #   webhook_channel   告警通道类型（none/discord/... ，不含 URL）
  #   entity_count_bucket / loaded_chunks_bucket / peak_players_bucket / heap_max_mb_bucket
  #                     规模量级桶（如 1000 表示 "不超过 1000"），用于判断大服的真实规模
  #   world_count / loaded_plugins   世界数与插件数
  #
  # 两层都不会上报：玩家名、世界名、坐标、插件列表、配置文件内容、告警文本、服务器地址。
  bstats-enabled: true

# TPS 监测
tps:
  enabled: true
  # TPS 告警阈值
  warning_threshold: 18.0
  critical_threshold: 15.0

# MSPT 监测
mspt:
  enabled: true
  # MSPT 告警阈值 (毫秒)
  warning_threshold: 45.0
  critical_threshold: 50.0

# 玩家监测
players:
  enabled: true
  # 玩家数告警阈值 (百分比 of max_players)
  # v1.2 重调：80% 容量即告警过于灵敏（16/20 人即刷告警），满员告警应接近满员
  warning_threshold: 90
  critical_threshold: 98

# 实体监测
entities:
  enabled: true
  # 实体总数告警阈值（全服合计：所有世界实体数相加后与下方阈值比较，与命令层 /perfscope entities 的总数口径一致）
  #
  # 【默认值依据】60 人在线的正常 Paper 服，全服实体数落在 5,000-15,000 区间
  #   （规模调研给出的区间，非本机实测）。旧默认 2000/3000 是"小服"假设，正常服开服
  #   几秒就会报 critical —— 那是首次安装被满屏误报淹没的主要原因之一。
  #   新默认按该区间的**上界**再留余量取整：
  #     total_warning_threshold  = 20,000（上界 15,000 再留约 33%：阈值贴着上界会在玩家高峰期反复越界）
  #     total_critical_threshold = 30,000（上界的 2 倍；warning:critical 仍为 1:1.5，与旧默认同形）
  #   ⚠️ 小服请下调。开服后先执行 /perfscope entities 看自己服的真实数量，
  #      再把阈值定在"正常高峰值 × 1.3"左右，否则永远收不到告警。
  #      单区块的实体密度是另一个键（hotspots.chunk-warning-threshold），不受此处影响。
  total_warning_threshold: 20000
  total_critical_threshold: 30000

# 区块监测
chunks:
  enabled: true
  # 加载区块数告警阈值 (每世界)
  #
  # ⚠️ 口径是「每个世界」，不是全服合计。只开 1 个世界的服上，这个值等于全服总数——
  #    所以阈值必须按"单个世界可能达到的上限"定，不能按"全服峰值均摊给 3 个世界"定。
  #
  # 【默认值依据】同样来自上述调研区间：60 人在线的正常 Paper 服，全服加载区块数
  #   3,000-8,000。单世界最坏情况是整个区间都压在一个世界上（单世界服），故按上界取：
  #     loaded_warning_threshold  = 10,000（上界 8,000 再留约 25%，取整）
  #     loaded_critical_threshold = 15,000（warning 的 1.5 倍，与实体阈值同一比例）
  #   ⚠️ 小服请下调；视距（view-distance）调得很高、或玩家长期分散在野外的服，实际值会更高，
  #      请先执行 /perfscope chunks 看每个世界的真实数字再定。改 view-distance 后也记得复核。
  loaded_warning_threshold: 10000
  loaded_critical_threshold: 15000

# 内存监测
memory:
  enabled: true
  # 堆内存使用率告警阈值 (百分比)
  # v1.2 重调：G1 正常水位 70-85% 属健康区间，80% 即告警过灵敏
  heap_warning_threshold: 85
  heap_critical_threshold: 95

# CPU 监测
cpu:
  # ⚠️ 关掉这一项**不只是关告警**，它会连采集一起停掉。
  #
  # 实测（2026-11-10，JFR 1ms 采样，三档负载一致）：JVM 采集节拍里 99.8% 的样本卡在
  # getProcessCpuLoad() 这一个调用上，单次阻塞 p50 171ms / p90 257ms / max 332ms，
  # 该异步 worker 有约 14% 的时间在阻塞。它在异步线程上跑、不占 tick，但开销是实打实的；
  # 而且它占的是 Bukkit **共享**异步池，会挤占同池内其他插件的任务。
  #
  # 因此 **Windows 上已自动跳过进程 CPU 采集**（该指标显示"未知"，见 README），
  # Linux / macOS 不受影响（读取是微秒级）。这个开关对两类平台的含义不同：
  #   - Windows：进程 CPU 本就不采，关掉只剩"系统 CPU 不采 + 告警停止"。
  #   - Linux/macOS：关掉可以省掉整个 CPU 采集与告警。
  # 如果你的服只关心 TPS/MSPT/内存，把 enabled 设为 false 可以完全省掉这部分开销。
  enabled: true
  # 进程 CPU 使用率告警阈值 (百分比)
  # 注意分母是【整机 CPU】：16 核机器上单个线程打满只显示 6.25%，
  # 要触发 80% 需要 13 个核被 JVM 吃满。单核卡死/GC 频繁这类问题请结合 TPS 与 MSPT 判断，
  # 调低本阈值反而可能让正常的高负载时段持续误报（合法范围 0 < 值 <= 100，越界会回退默认值）。
  process_warning_threshold: 80.0
  # 系统 CPU 使用率告警阈值 (百分比；同样是整机口径，包含 JVM 之外的进程占用)
  system_warning_threshold: 90.0
  # 迟滞带宽度（百分点，合法范围 0-50，默认 5.0）
  #
  # 【为什么需要这一项】CPU 读数的采样方差远大于阈值间距。实测（E5-2660 v2，施加负载后）
  # 采样标准差约 12 个百分点，样本在 55%-100% 之间摆动。若进入和退出共用同一个阈值，
  # 就会出现「越界 3 秒 → 恢复 → 2 秒后又越界 → 复燃」的无限锯齿：
  # 6 小时实测 1333 条告警消息，而 300 秒冷却在复燃路径上完全失效。
  #
  # 【迟滞怎么工作】进入告警用 system/process_warning_threshold，退出用「阈值 - 本值」。
  # 例如阈值 90 + 迟滞 5：>90 才告警，跌到 <85 才解除，落在 85-90 之间保持原判定。
  # 这条带吸收了采样噪声，锯齿从源头消失。
  #
  # 【怎么调】设为 0 = 关闭迟滞（退回旧行为，不推荐，只在你确定读数很稳时用）。
  # 你的机器若 CPU 长期在阈值附近（如 E5 常年 90% 上下），调大本值（如 8-10）能进一步减少翻转；
  # 但不要超过 50——那会把退出线压到阈值一半以下，真实的过载会永远退不出去。
  hysteresis_margin: 5.0

# 红石监测 —— v1.1 已下线（此前为空实现/启发式检测，未真正采集）
# 以下配置不再被读取，仅保留注释供老用户参考，可安全删除
#redstone:
#  enabled: true

# Tile Entity 监测
tile_entities:
  enabled: true

# 网络监测 —— v1.1 已下线（此前为硬编码 0 的假数据，未实现）
# 以下配置不再被读取，仅保留注释供老用户参考，可安全删除
#network:
#  enabled: true
#  # 网络流量告警阈值 (bytes/sec)
#  warning_threshold: 10485760  # 10 MB/s

# 报告生成
report:
  # 是否启用定时自动导出
  auto_export: false
  # 自动导出间隔 (分钟)
  auto_export_interval: 30
  # 报告格式: html, txt, json
  format: html
  # 报告保留天数 (0 = 永久保留)
  retention_days: 7

# 告警推送 (9A-14 决策层重写：生命周期 + 历史 + 防抖对称 + digest 合并)
#
# ⚠️ 关于"周期"的含义（9A-14 修正旧文档的严重误导）：
#   本段的 debounce-cycles / recovery-debounce-cycles 单位是"检查周期"，
#   一个检查周期 = general.update_interval（默认 20 tick ≈ 1 秒）。
#   所以默认 3 周期 ≈ 3 秒，不是 3 分钟！想抑制 1 分钟的 TPS 抖动请调到 60 以上
#   （例如 60 ≈ 1 分钟；与 tps 的 1 分钟均值窗口对齐才有实际意义）。
alerts:
  # 总开关 (false = 完全不做告警检查与推送)
  #
  # 【v1.4 起默认 false —— 告警是"选择加入"，不是"默认开启"】
  #   原因：任何一套随包默认阈值都不可能同时适合小服与超大服。默认开启时，服主在还没看过
  #   自己服的真实规模之前，就先被一轮与自己无关的 critical 告警刷屏（首装几分钟内就发生），
  #   而插件本身其实运转正常。默认关闭后：采集、/perfscope 全量诊断、报告、历史、Prometheus
  #   全部照常工作，只有"推送"这一层需要你先点头。
  #
  #   开启步骤（三步，约 1 分钟）：
  #     1) 启动一次服务器，执行下列命令，记下你自己服的真实数字：
  #          /perfscope entities    → 看全服实体总数与"按世界分布"
  #          /perfscope chunks      → 看每个世界的加载区块数
  #          /perfscope             → 看 TPS / MSPT / 内存 的常态读数
  #     2) 按"正常高峰值 × 1.3"改写上面 entities / chunks / memory / tps 段的阈值
  #        （随包默认按 60 人在线的中服估算，小服与超大服都必须自己调）。
  #     3) 把本行改成 enabled: true，再执行 /perfscope reload。
  #
  #   ⚠️ 旧版本配置里已写 enabled: true 的服主不受影响：配置从你的文件读，不与随包默认合并。
  enabled: false
  # 控制台推送 (critical 用 severe / warning 用 warning / 恢复用 info)
  console: true
  # 游戏内推送 (发送给在线且有 perfscope.alert 权限的玩家)
  in-game: true
  # 同一告警的冷却秒数 (0 = 无冷却，仍受检查周期节流)
  # 语义（9A-14）：冷却只压制"同一告警的重复提醒"；恢复后的复燃会绕过冷却单独通知。
  cooldown-seconds: 300
  # 恢复通知 (告警连续 N 个干净周期后推送一条"已恢复正常")
  notify-recovery: true
  # 降级通知（9A-14）：critical 掉到 warning 时推一条「已缓解」（问题仍在，不是恢复）
  notify-mitigation: true
  # 防抖：同一告警需连续 N 个检查周期超标才首次推送 (默认 3，钳 ≥1；1 = 首次出现即推)
  # ⚠️ 单位是检查周期（≈ general.update_interval，默认 1 秒），3 周期 ≈ 3 秒
  # 目的：抑制指标在阈值附近秒级抖动产生的告警/恢复交替噪音
  debounce-cycles: 3
  # 恢复防抖（9A-14）：需连续 N 个检查周期都不越界才宣布"已恢复正常"
  # 默认与上方 debounce-cycles 同值；1 = 一个干净周期即宣布恢复（旧行为，不推荐）
  recovery-debounce-cycles: 3
  # 告警摘要模式（9A-14）：true = 同一检查周期内的多条新增告警合并成一条消息
  # （按指标分组，最多列 5 条 + "等 N 条"）；级别升级 / 复燃仍即时单独发
  digest-mode: false
  # 模块失效转 unknown（9A-14）：告警所属采集模块连续不可用超过 N 分钟，
  # 该告警转入 unknown 状态（不再算"活跃"）；模块恢复后若问题已消失则静默解决（不发"已恢复"）
  unknown-after-minutes: 5

  # ---- 抖动抑制（本版新增，专治"阈值边界锯齿"）----
  # 背景：指标稳定在阈值附近时，会出现「恢复 → 复燃 → 恢复 → 复燃」的无限循环。
  # 实测（E5-2660 v2，90% 阈值）6 小时产出 1333 条消息。下面三项共同把它压到个位数。
  # 三项各自独立可调，全部设为 0 即完全恢复旧行为。

  # 抖动窗口（秒，默认 180，0 = 关闭）
  # 该窗口内发生的"恢复 → 再次越界"，视为同一次事故的中间态：
  # 不推送"已恢复正常"，也不推送"问题再次出现"，状态机静默接管。
  # 取值依据：用户日志里 5 次恢复有 4 次发生在 2-40 秒内（60 秒即可挡掉绝大部分假恢复）；
  # 真机 10 分钟波动负载实测的「恢复 → 再次越界」间隔落在 4-66 秒，60 秒窗口会漏掉 66 秒那次，
  # 故取 180 秒留出余量。不再更长的原因：超过 5 分钟会把真实的短暂故障也吞掉
  # （故障发生 → 5 分钟内自愈 → 用户从未收到过任何通知）。
  flap-window-seconds: 180

  # 同级别重推的数值变化阈值（默认 8，0 = 关闭）
  # 一条长期 92% 的告警每 5 分钟重说一遍"系统CPU负载偏高: 92%"没有任何新信息；
  # 但从 92% 跳到 99% 是用户想知道的。只有变化达到该幅度才重推。
  # 设 0 = 恢复旧的"冷却到期就重推"行为。
  repush-delta: 8

  # 复燃最短间隔（秒，默认 60，0 = 关闭）
  # 告警恢复后，只有在该窗口内再次越界才算"复燃"（推送"（问题再次出现）"）：
  # 窗口取短值，因为几秒内又坏了确实该立即告知，而不是等冷却。
  # 设 0 = 关闭复燃识别：不再区分"复燃"与"新告警"，再次越界按普通新告警处理。
  #   注意：普通新告警仍受 alerts.cooldown-seconds 约束，故并非"无视冷却立即推送"。
  # 负值或非数值回退默认 60 秒。
  refire-min-interval-seconds: 60

  # 每日摘要 (5 行概况：最低 TPS/p95/超阈时长/峰值实体/峰值内存 / MSPT 尖峰 / CPU 峰值与 GC 增量 / 告警统计；
  #   推送到控制台、在线 OP 与 webhook。未采集的指标显示"本窗口未采集"而不是 0)
  # 补发语义：若配置时刻已过且当日未发（如服务端在彼时停机），启动/重载后补发一次，保证"每天都到"
  daily-summary:
    enabled: false            # 默认关
    time: "08:00"             # HH:mm
    # 时区（9A-14）：IANA 名（如 Asia/Shanghai / UTC），留空 = 跟随 JVM 系统时区
    # 容器/云主机常是 UTC，此时"08:00"实际是北京时间 16:00——请显式设置
    timezone: ""

  # webhook 推送 (告警 / 恢复 / 日摘要统一出口；异步发送，失败仅记日志，不重试不阻塞)
  webhook:
    enabled: false
    # 通道类型，五选一（大小写不敏感）：
    #   discord   Discord       地址：频道设置 → 整合 → Webhook → 新建 → 复制 URL
    #   onebot    QQ OneBot     地址：自己搭的 QQ 机器人，必须走本机回环
    #                            （http://127.0.0.1:3000/send_private_msg?user_id=...）
    #   wecom     企业微信群机器人 地址：群 → 添加群机器人 → 复制 Webhook
    #                            （https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=...）
    #   feishu    飞书自定义机器人 地址：群设置 → 群机器人 → 添加 → 复制 Webhook
    #                            （https://open.feishu.cn/open-apis/bot/v2/hook/...）
    #   dingtalk  钉钉自定义机器人 地址：群设置 → 智能群助手 → 添加机器人 → Webhook
    #                            （https://oapi.dingtalk.com/robot/send?access_token=...）
    # 写错会被纠正为 discord 并在控制台告警。
    type: discord
    url: ""                   # 完整 webhook 地址（含令牌），原样粘贴即可
    # 加签密钥：只有 feishu / dingtalk 需要，其余类型请留空（填了会被忽略并告警）。
    #   feishu   — 机器人「安全设置 → 签名校验」里复制
    #   dingtalk — 机器人「安全设置 → 加签」里复制（通常以 SEC 开头）
    #
    # ⚠️ 两点务必注意：
    #   1. 两端不要留空格或换行。空白是签名数据的一部分，多一个空格就会验签失败，
    #      而平台只会回「签名不匹配」，不会告诉你是空白问题。
    #   2. 纯数字的密钥必须加引号（secret: "123456"），否则 YAML 会把它解析成数字而丢弃。
    # 属凭据：插件日志与命令回执永不回显本值。
    secret: ""

# 历史采样（v1.2：24h 环形缓冲 + 按天 CSV 文件持久化；重启不清零）
history:
  enabled: true
  # 采样间隔（秒）；环形容量自动 = 86400/间隔（约 24 小时窗口）
  sample-interval-seconds: 60
  # 文件持久化（plugins/PerfScope/history/history-<日期>.csv；重启后 /perfscope trend 可查）
  persist: true
  # 历史文件保留天数（超期文件在启动/重载时清理）
  retention-days: 7

# 热点区块定位（Wave 8C：实体密度最高的区块坐标，/perfscope hotspot 查看）
hotspots:
  enabled: true
  # 采样节流（每 N 个采集周期完成一轮完整扫描；默认 30 ≈ 30 秒）
  sample-every-cycles: 30
  # 分区增量扫描分片数（v1.4）：一轮扫描被切成 N 片，摊到多个采集周期完成。
  # 一轮覆盖的区块集合与「一次性全遍历」完全相同，但单拍成本降到约 1/N
  # （实测 11,048 区块：40.5 ms → 约 5 ms）。
  #   1   = 关闭分片，退回旧的一次性全遍历（对照/排查用）
  #   10  = 默认，约 1/10 单片成本（30 周期 ÷ 10 片 = 每 3 个采集周期扫一片）
  #   越大越省单拍开销，但同一批区块刷新越慢（一轮周期数恒 ≥ sample-every-cycles）
  # 注意：热点结果在轮次之间是复用上一轮完整结果的，不会每片都刷出新榜单；
  # 只有首轮（尚未有任何完整结果）才会按分片发布部分结果，避免长时间显示"暂无数据"。
  scan-shards: 10
  # 单个区块的实体数告警阈值（注意：这是"一个区块"的口径，与上方 entities 段的全服总数不同）。
  # /perfscope diagnose 的热点规则用它判定；默认 200 即单区块 200 个实体会被点出坐标。
  chunk-warning-threshold: 200

# Prometheus 指标端点 (v1.4)
# 让指标脱离游戏内命令，进入你已有的监控栈（Prometheus 抓取 → Grafana 看板）。
# 零第三方依赖：用 JDK 自带的 com.sun.net.httpserver 实现，不增加 jar 体积。
#
# ⚠️ 安全：端点会暴露在线玩家数、世界名、插件数量。默认只听 127.0.0.1 且不鉴权——
# 本机抓取安全，但绑到 0.0.0.0 就等于对局域网/公网开放。改绑定时插件会打 WARNING。
#
# ⚠️ 容器里最常见的坑（同类 exporter 的社区 issue 几乎全是这一条）：
#   容器内的 127.0.0.1 是【容器自己】的回环，既不是宿主机，也不是面板节点。
#   所以在 Docker（bridge / 自定义网络）/ Pterodactyl / MCSManager 里保持 bind: "127.0.0.1"，
#   容器外的 Prometheus 无论怎么抓都连不上——外部表现为 connection refused / 超时，
#   而进容器里 curl 127.0.0.1:8940 却是通的（这个反差就是判定依据）。
#   要被抓取：bind 改成 "0.0.0.0"，然后抓【容器 IP 或节点 IP】，不是抓 127.0.0.1。
#   例外（这两种 bind 保持 "127.0.0.1" 即可，不必放大）：
#     a) --network host：容器与宿主机共享网络命名空间，容器内 127.0.0.1 就是宿主回环，
#        且该模式下 docker run -p 会被完全忽略；
#     b) kubectl port-forward：kubelet 在 pod 自己的 netns 里拨 localhost。
#
# 面板服怎么把端口开出来（以 Pterodactyl 系为例，管理员约三步）：
#   1) 面板加端口分配：Admin → Servers → 该服 → Build Configuration →
#      "Assign Additional Ports"，从节点池里选一个分配项。
#      注意：分配是【节点端口池里的既有条目】，不是随手填个数字——所以实际监听端口
#      以分到的那个为准，未必是 8940（下面的 prometheus.port 要与它一致）。
#      （MCSManager 在实例的端口列表里加；非 Docker 实例不涉及发布，直接绑宿主端口即可。）
#      注意：即使 allocation_limit 大于 0，客户端的「Create Allocation」仍需面板【全局】开启
#      Admin → Settings → Advanced → "Automatic Allocation Creation"
#      （pterodactyl.client_features.allocations.enabled，默认关闭，关闭时抛
#      AutoAllocationNotEnabledException），且节点端口池里要划出端口段，否则抛
#      NoAutoAllocationSpaceAvailableException。
#   2) 本文件 bind 改 "0.0.0.0"——只加分配不改 bind，外部照样进不来。
#   3) Prometheus 抓 http://<节点IP>:<分到的公网端口>/metrics。
#   注意：Wings 绑宿主端口用的是【分配项里记录的那个 IP】——可能是具体地址，也可能是 0.0.0.0
#   （分配写 127.0.0.1 时会被改写到 pterodactyl0 网桥，默认 172.18.0.1），所以分配记的是具体
#   非回环地址时，从宿主机自己的 localhost:8940 抓可能失败。
#   这不代表端点没起来——用 docker ps 看实际端口映射，抓映射出来的那个 IP:端口。
prometheus:
  # 总开关。默认关闭：绝大多数服主没有 Prometheus，开了只会多一个监听端口。
  enabled: false
  # 监听地址。127.0.0.1 = 只听本机（安全；但容器外抓不到，原因见上方"容器里最常见的坑"）；
  # 容器有独立网络命名空间（bridge / 自定义网络）/ 多机 / 面板服抓取要改 0.0.0.0
  # （启动会打 WARNING），并建议同时设置 auth-token；--network host 与 kubectl port-forward
  # 两种例外保持 127.0.0.1 即可。
  bind: "127.0.0.1"
  # 监听端口。默认 8940：该端口在 IANA 与 Prometheus 官方 Default-port-allocations wiki 中均未分配
  # （8941-8952 同样空闲），同时避开了 9090(Prometheus) 与 9100(node_exporter)。
  # 不要改回 9940 及 99xx 段：9940 已被 minecraft-prometheus-exporter 占用（papermc_prometheus_exporter
  # 也用它），9941 = huawei-lte-exporter、9942 = drbd、9943 = FileStat，撞端口的只会是本插件。
  port: 8940
  # 抓取路径。必须以 / 开头（缺失会自动补上并告警）。
  path: "/metrics"
  # 跨服身份标签 server_id。留空 = 自动派生（首个世界名，回退为端口）。
  # 多服聚合时务必给每个服设一个不同的值，否则 Grafana 会把两条序列画成一条。
  server-id: ""
  # Bearer 鉴权令牌。留空 = 不鉴权。非空时抓取方需带 Authorization: Bearer <token>。
  # 属凭据：插件日志只会记录端点地址，绝不回显本值。
  # 注意：设了 token 却忘了在 prometheus.yml 里带请求头时，插件返回 401 + WWW-Authenticate:
  # Bearer，而 Prometheus 把任何非 200 都记为抓取失败（up == 0）——表现为 target DOWN 且没有
  # 可读原因，像网络故障；去 Prometheus 的 Targets 页面看 scrape error 才能定位。
  auth-token: ""

# 各世界单独设置 (可覆盖全局设置)
# 语义（与采集层判定一致）：此处配置了的世界，其实体数按该世界独立阈值逐世界判定；
# 未在此处配置的世界，不逐世界判定，统一由上方 entities 段的全服合计阈值覆盖。
# 世界名必须是 Bukkit 的真实世界名（区分大小写，如 world / world_nether / world_the_end）。
# 9A-11：加载时插件会把这里的世界名与当前已加载世界比对，不认识的名字会 WARNING 并列出可用世界名。
#
# 【v1.4 重标定：这三项是**示例**，不是推荐值】
#   值来自一个明确假设，不是实测：把上方全服告警阈值(20,000/30,000)按
#   「主世界 60% / 下界 25% / 末地 15%」的常见占比摊到三个世界。
#   三个世界的阈值之和恰好等于全服阈值，所以两套口径不会互相打架。
#   ⚠️ 你的服可能只有 1 个世界、或有自定义世界名，这时请**直接改这里的世界名与数值**，
#      或整段删掉（删掉后未配置的世界由全服合计阈值统一判定，功能不会少）。
#      用 /perfscope entities 的「按世界分布」查看你自己服的真实占比。
#
# 【为什么加了 critical 行】旧示例只写 warning，critical 会静默回退成全服的 30,000——
#   于是「某世界 warning 了、全服没 critical、这个世界也永远 critical 不了」，
#   阈值形同虚设。这里显式给出 1.5 倍（与全服 warning:critical 同一比例）。
worlds:
  world:
    entities:
      total_warning_threshold: 12000
      total_critical_threshold: 18000
  world_nether:
    entities:
      total_warning_threshold: 5000
      total_critical_threshold: 7500
  world_the_end:
    entities:
      total_warning_threshold: 3000
      total_critical_threshold: 4500
